services:
  identityserver:
    build:
      context: ./src/identityserver/identityserver
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      IDENTITY_SERVER_PORT: ${IDENTITY_SERVER_PORT:-5001}
      ASPNETCORE_URLS: https://+:${IDENTITY_SERVER_PORT:-5001}
      Kestrel__Certificates__Default__Path: /certificates/local-cert.pfx
      DATA_PROTECTION_KEYS_PATH: /app/keys/data-protection
      WEBAPP_ORIGIN: https://localhost:${WEBAPP_PORT:-3000}
      IDENTITY_SERVER_CLIENT_SECRET: ${IDENTITY_SERVER_CLIENT_SECRET:?Set IDENTITY_SERVER_CLIENT_SECRET in .env.docker}
    ports:
      - "127.0.0.1:${IDENTITY_SERVER_PORT:-5001}:${IDENTITY_SERVER_PORT:-5001}"
    volumes:
      - identityserver-keys:/app/keys
      - identityserver-diagnostics:/app/diagnostics
      - ./certificates:/certificates:ro
    networks:
      default:
        aliases:
          - identityserver.localhost
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/127.0.0.1/$$IDENTITY_SERVER_PORT'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  webapp:
    build:
      context: ./src/webapp
      dockerfile: Dockerfile
    depends_on:
      identityserver:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXTAUTH_URL: https://localhost:${WEBAPP_PORT:-3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.docker}
      IDENTITY_SERVER_ISSUER: https://identityserver.localhost:${IDENTITY_SERVER_PORT:-5001}
      IDENTITY_SERVER_CLIENT_ID: interactive
      IDENTITY_SERVER_CLIENT_SECRET: ${IDENTITY_SERVER_CLIENT_SECRET:?Set IDENTITY_SERVER_CLIENT_SECRET in .env.docker}
      IDENTITY_SERVER_CA_CERT: /certificates/local-cert.pem
      HTTPS_CERT_FILE: /certificates/local-cert.pem
      HTTPS_KEY_FILE: /certificates/local-key.pem
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-3000}:3000"
    volumes:
      - ./certificates:/certificates:ro
    restart: unless-stopped

volumes:
  identityserver-keys:
  identityserver-diagnostics:
